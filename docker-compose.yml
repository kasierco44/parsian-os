services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: parsian_os
      POSTGRES_USER: parsian
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-dev-only-change-this}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U parsian -d parsian_os"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+psycopg://parsian:${POSTGRES_PASSWORD:-local-dev-only-change-this}@db:5432/parsian_os
      CORS_ORIGINS: http://localhost:3000,http://localhost:8000
      CATALOG_MEDIA_ROOT: /var/lib/parsian/catalog
    volumes:
      - ./private-media:/var/lib/parsian/catalog
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
