name: PARSIAN FINAL Android debug builds

on:
  push:
    branches: [feature/parsian-final-core-platform]
    paths:
      - 'android/**'
      - '.github/workflows/parsian-android-build.yml'
  pull_request:
    branches: [main, feature/parsian-final-core-platform]
    paths:
      - 'android/**'
      - '.github/workflows/parsian-android-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android platform
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Assemble seller and customer debug APKs
        working-directory: android
        run: gradle --no-daemon --stacktrace :app:assembleSellerDebug :app:assembleCustomerDebug
      - name: Upload debug APKs
        uses: actions/upload-artifact@v4
        with:
          name: parsian-android-debug-apks
          path: |
            android/app/build/outputs/apk/seller/debug/*.apk
            android/app/build/outputs/apk/customer/debug/*.apk
          if-no-files-found: error
          retention-days: 14
