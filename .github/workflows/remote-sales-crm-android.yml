name: Remote Sales CRM Android APK

on:
  push:
    branches:
      - feat/remote-sales-crm-android
  pull_request:
    paths:
      - "mobile/remote-sales-crm/**"
      - ".github/workflows/remote-sales-crm-android.yml"
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android debug APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile/remote-sales-crm
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android platform
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Install JavaScript dependencies
        run: |
          npm install
          npx expo install --check

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: parsian-remote-sales-crm-debug-apk
          path: mobile/remote-sales-crm/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
