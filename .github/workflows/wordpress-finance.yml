name: WordPress Finance Plugin
on:
  push:
    branches:
      - feat/wordpress-finance-plugin
      - feat/wordpress-backend-auth-bridge
      - feat/wordpress-finance-api-proxy
  pull_request:
    paths:
      - 'wordpress/parsian-finance/**'
      - '.github/workflows/wordpress-finance.yml'
jobs:
  php-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: PHP syntax check
        run: |
          php -l wordpress/parsian-finance/parsian-finance.php
          php -l wordpress/parsian-finance/backend-bridge.php
      - name: JavaScript syntax check
        run: |
          python3 - <<'PY'
          from pathlib import Path
          source = Path("wordpress/parsian-finance/parsian-finance.php").read_text(encoding="utf-8")
          start_marker = "return <<<'JS'"
          start = source.index(start_marker) + len(start_marker)
          end = source.index("JS;}", start) - 1
          Path("/tmp/parsian-finance.js").write_text(source[start:end], encoding="utf-8")
          PY
          node --check /tmp/parsian-finance.js
      - name: Build plugin ZIP
        run: |
          cd wordpress
          zip -r parsian-finance.zip parsian-finance
      - uses: actions/upload-artifact@v4
        with:
          name: parsian-finance-wordpress-plugin
          path: wordpress/parsian-finance.zip
