name: Backend CI

on:
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: parsian
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: parsian_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U parsian -d parsian_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    env:
      APP_ENV: test
      JWT_SECRET: ci-only-secret-not-for-production
      DATABASE_URL: postgresql+psycopg://parsian:test-only-password@localhost:5432/parsian_test
      TEST_DATABASE_URL: postgresql+psycopg://parsian:test-only-password@localhost:5432/parsian_test
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run unit and PostgreSQL migration tests
        run: pytest -q
