name: PARSIAN ONE Windows desktop bundle

on:
  push:
    branches: [feature/parsian-final-core-platform]
    paths:
      - 'desktop/**'
      - 'web/parsian-panels/**'
      - '.github/workflows/parsian-windows-build.yml'
  pull_request:
    branches: [main, feature/parsian-final-core-platform]
    paths:
      - 'desktop/**'
      - 'web/parsian-panels/**'
      - '.github/workflows/parsian-windows-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-bundle:
    runs-on: windows-latest
    timeout-minutes: 50
    env:
      RUST_BACKTRACE: full
    steps:
      - uses: actions/checkout@v4
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked
      - name: Verify desktop manifest
        working-directory: desktop/src-tauri
        run: cargo metadata --locked --no-deps
      - name: Build MSI and NSIS bundles
        working-directory: desktop
        run: cargo tauri build --verbose --bundles msi,nsis
      - name: Verify Windows installers
        shell: pwsh
        run: |
          $msi = Get-ChildItem -Path "desktop/src-tauri/target/release/bundle/msi" -Filter "*.msi" -ErrorAction Stop
          $nsis = Get-ChildItem -Path "desktop/src-tauri/target/release/bundle/nsis" -Filter "*.exe" -ErrorAction Stop
          if (-not $msi -or -not $nsis) { throw "Expected MSI and NSIS installers were not produced." }
      - name: Upload Windows installers
        uses: actions/upload-artifact@v4
        with:
          name: parsian-one-windows-dev-installers
          path: |
            desktop/src-tauri/target/release/bundle/msi/*.msi
            desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14
