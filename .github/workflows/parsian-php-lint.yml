name: PARSIAN FINAL PHP lint

on:
  pull_request:
    paths:
      - 'wordpress/parsian-final/**/*.php'
      - '.github/workflows/parsian-php-lint.yml'
  push:
    branches:
      - feature/parsian-final-core-platform
    paths:
      - 'wordpress/parsian-final/**/*.php'
      - '.github/workflows/parsian-php-lint.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  php-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
      - name: Lint every plugin PHP file
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' files < <(find wordpress/parsian-final -type f -name '*.php' -print0)
          test "${#files[@]}" -gt 0
          for file in "${files[@]}"; do
            echo "Linting $file"
            php -l "$file"
          done
